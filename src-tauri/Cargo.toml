[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "planocasa"
version = "0.1.0"
description = "PlanoCasa: planos de vivienda y decoración en 2D/3D, 100 % local"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
# Nombre distinto del binario para evitar choques en Windows (plantilla oficial de Tauri 2).
name = "planocasa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
planocasa-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
# Sin features extra: nada de "devtools" ni "tray-icon" hasta que hagan falta.
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
