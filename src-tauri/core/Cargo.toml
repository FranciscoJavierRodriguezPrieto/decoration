[package]
name = "planocasa-core"
version = "0.1.0"
description = "E/S del formato .planocasa (ZIP con project.json + assets/). Sin dependencias de Tauri para poder probarlo aislado."
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[dependencies]
thiserror = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
